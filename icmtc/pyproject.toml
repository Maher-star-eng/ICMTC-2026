[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icmtc-mission2"
version = "0.1.0"
description = "ICMTC 2026 Mission 2 UAV vision pipeline"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "PyYAML",
]

[project.optional-dependencies]
training = ["torch", "torchvision", "ultralytics", "opencv-python", "ncnn", "onnxruntime"]
mavlink = ["pymavlink"]

[tool.setuptools]
packages = ["vision", "geo", "ioutils", "core", "training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
